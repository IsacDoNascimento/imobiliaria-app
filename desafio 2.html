<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desafio 1 - Financiamento Imobiliário</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">🏠 Imobiliária Web</a>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
          <li class="nav-item"><a class="nav-link active" href="desafio1.html">Financiamento</a></li>
          <li class="nav-item"><a class="nav-link" href="desafio2.html">Aluguel</a></li>
          <li class="nav-item"><a class="nav-link" href="desafio3.html">Reajuste</a></li>
          <li class="nav-item"><a class="nav-link" href="desafio4.html">Comparação</a></li>
          <li class="nav-item"><a class="nav-link" href="desafio5.html">Ordenação</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container my-5">
    <div class="card shadow-sm p-4 mx-auto" style="max-width: 600px;">
      <h3 class="card-title text-primary mb-3">1. Financiamento Imobiliário</h3>
      <p class="text-muted">Simula parcelas mensais fixas com base no valor do imóvel, entrada, taxa de juros e prazo.</p>
      
      <div class="mb-3">
        <label class="form-label">Valor do Imóvel (R$):</label>
        <input type="number" id="fin-valor" class="form-control" placeholder="Ex: 250000">
      </div>
      <div class="mb-3">
        <label class="form-label">Entrada (R$):</label>
        <input type="number" id="fin-entrada" class="form-control" placeholder="Ex: 50000">
      </div>
      <div class="mb-3">
        <label class="form-label">Taxa de Juros Anual (%):</label>
        <input type="number" id="fin-juros" class="form-control" placeholder="Ex: 9.5">
      </div>
      <div class="mb-3">
        <label class="form-label">Prazo (Anos):</label>
        <input type="number" id="fin-anos" class="form-control" placeholder="Ex: 20">
      </div>

      <button onclick="calcularFinanciamento()" class="btn btn-primary mb-3">Calcular Parcela</button>
      <div id="res-financiamento" class="alert alert-secondary resultado-box">Preencha os dados acima para calcular.</div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
