    <div class="card shadow-sm p-4 mx-auto" style="max-width: 600px;">
      <h3 class="card-title text-primary mb-3">3. Reajuste Anual de Aluguel</h3>
      <p class="text-muted">Aplica a porcentagem de reajuste (IGP-M/IPCA) sobre o valor atual do contrato.</p>
      
      <div class="mb-3">
        <label class="form-label">Valor Atual do Aluguel (R$):</label>
        <input type="number" id="reaj-atual" class="form-control" placeholder="Ex: 1500">
      </div>
      <div class="mb-3">
        <label class="form-label">Índice de Reajuste (%):</label>
        <input type="number" id="reaj-taxa" class="form-control" placeholder="Ex: 4.5">
      </div>

      <button onclick="calcularReajuste()" class="btn btn-primary mb-3">Aplicar Reajuste</button>
      <div id="res-reajuste" class="alert alert-secondary resultado-box">Insira os valores para atualizar.</div>
